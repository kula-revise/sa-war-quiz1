:1,"marks":2,"prompt":"Gold was discovered in 1886. Where was it found?","options":["On the Witwatersrand, in the Transvaal","At Kimberley, in the Northern Cape","Near Durban, on the coast of Natal","In the Eastern Cape, near Grahamstown"],"correct":0,"feedback":"Gold was found on the Witwatersrand in 1886. Kimberley is where the diamonds were, not the gold."},{"id":"q2","section":"s1","item_ref":"1.2","tier":"Recall","caps_level":1,"marks":2,"prompt":"The Randlords were a small group of very rich men. What made them rich?","options":["They owned and controlled the large gold mining companies","They were the elected leaders of the Transvaal government","They were skilled white workers who earned the highest wages","They owned the railway lines that carried gold to the ports"],"correct":0,"feedback":"A Randlord was a rich mine owner on the Rand. Cecil Rhodes, Alfred Beit and Barney Barnato controlled large mining companies. Skilled white workers were paid better than black workers, but they owned nothing."},{"id":"q3","section":"s1","item_ref":"1.3","tier":"Recall","caps_level":1,"marks":2,"prompt":"The mine owners started the Chamber of Mines. What did it help them do?","options":["Keep the wages of black workers low","Raise the world price of gold abroad","Train black workers for the skilled jobs","Collect the taxes for the Transvaal government"],"correct":0,"feedback":"The Chamber of Mines let the owners act as one group and hold black wages down. They could not raise the price of gold, because that price was fixed outside South Africa."},{"id":"q4","section":"s1","item_ref":"1.4","tier":"Recall","caps_level":1,"marks":2,"prompt":"Black mineworkers signed contracts of six to eighteen months. Where did they live during that time?","options":["In closed compounds (fenced living areas) at the mine","In their own homes, near their families in the town","In houses the government built for their whole family","In hostels that they were free to leave at any time"],"correct":0,"feedback":"Workers lived in closed compounds at the mine, far from their families. The compound controlled where they slept and when they could move. Leaving freely was not allowed."},{"id":"q5","section":"s1","item_ref":"1.5","tier":"Recall","caps_level":1,"marks":2,"prompt":"In 1886 the Witwatersrand was farmland. What was Johannesburg by 1899?","options":["A city of more than 120 000 people","A mining camp of about 5 000 people","The capital city of the Cape Colony","A port city on the eastern coast"],"correct":0,"feedback":"Johannesburg grew from farmland in 1886 into a city of more than 120 000 people by 1899. That speed shows how strongly gold pulled people to the Rand."},{"id":"q6","section":"s1","item_ref":"1.6","tier":"Recall","caps_level":1,"marks":2,"prompt":"Some black South Africans found work in the new towns instead of the mines. Who were the amaWasha?","options":["Zulu men who washed clothes for people in town","Farmers who sold cattle to the mining companies","Workers who cut wood for the mine machines","Traders who sold gold in the streets of the town"],"correct":0,"feedback":"The amaWasha were Zulu washermen who built their own work in Johannesburg. They show that black South Africans made choices and used the new chances that the towns created."},{"id":"q7","section":"s1","item_ref":"1.7","tier":"Understand","caps_level":2,"marks":2,"prompt":"The world price of gold was fixed. Mining the deep gold cost a great deal. Why did this push black wages down?","options":["Owners could not raise the price, so they cut their costs instead","Owners had to pay a heavy tax on every worker that they hired","Black workers refused the training that was needed for higher pay","The Transvaal government set one maximum wage for all workers"],"correct":0,"feedback":"A fixed price means the income cannot be raised. So owners raised their profit by cutting costs, and wages were the largest cost they controlled. Wages fell because of profit, not because of skill."},{"id":"q8","section":"s1","item_ref":"1.8","tier":"Understand","caps_level":2,"marks":2,"prompt":"Many African men took mine work in the 1890s. Which pressure best explains why they needed cash?","options":["Taxes had to be paid in money, and land and cattle were being lost","Mine work paid more money than any other job that was open to them","A law forced every African man to work on the mines for one year","Schools in the rural areas charged fees that only mine wages covered"],"correct":0,"feedback":"Taxes such as the hut tax had to be paid in cash. Land loss and the rinderpest cattle disease made farming harder. Men made a choice, but pressure shaped that choice. No law forced every man onto the mines."},{"id":"q9","section":"s1","item_ref":"1.9","tier":"Understand","caps_level":2,"marks":2,"prompt":"Men were away on the mines for months at a time. What did this mean for women at home?","options":["They did almost all the farming, the childcare and the household work","They moved to Johannesburg to live with the men inside the compounds","They were given the land of the men to sell, so their income rose","They stopped farming, because the wages sent home paid for the food"],"correct":0,"feedback":"Women did the farming, the children and the home on their own. Their unpaid work kept rural families alive. It also kept the mines supplied with workers who cost very little."},{"id":"q10","section":"s1","item_ref":"1.10","tier":"Understand","caps_level":2,"marks":2,"prompt":"Mining companies paid black workers a single man's wage. What does that mean?","options":["Enough money for one man only, and not enough for a family","The same wage for every worker, whatever the job they did","A wage that was paid once, at the end of the long contract","A wage that was paid only to men who were not yet married"],"correct":0,"feedback":"A single man's wage covered one worker, not a family. Families in the rural areas had to feed themselves. The low wage worked only because women kept farming at home."},{"id":"q11","section":"s1","item_ref":"1.11","tier":"Understand","caps_level":2,"marks":2,"prompt":"The number of black mineworkers grew from about 14 000 in 1890 to nearly 100 000 in 1899. What explains that growth?","options":["Deep mining needed huge numbers of workers to break and move the rock","The mines paid better wages each year, so more men chose the work","The government ordered every district to send its men to the Rand","Machines had broken down, so the mines needed hands to replace them"],"correct":0,"feedback":"Gold lay far underground in hard rock. Getting it out took thousands of hands. Wages were held down through those years, not raised, so pay was not the pull."},{"id":"q12","section":"s1","item_ref":"1.12","tier":"Understand","caps_level":2,"marks":2,"prompt":"Railway lines grew from 109 km in the 1860s to 3 274 km by the 1890s. Why were they built so fast?","options":["The mines needed heavy machinery brought in and goods carried out","The government wanted farmers to reach the markets in the Cape","Railways were cheaper to build than roads across the open ground","Britain paid for them so that its troops could reach the border"],"correct":0,"feedback":"Deep mining ran on machinery too heavy for ox wagons. Railways carried it in and carried goods out. The mines pulled the lines, not farming."},{"id":"q13","section":"s1","item_ref":"1.13","tier":"Apply","caps_level":3,"marks":2,"prompt":"Nomsa says the Mineral Revolution helped everyone in South Africa. Which fact challenges her claim most strongly?","options":["Black workers did the hardest jobs, and the law blocked better ones","Johannesburg grew into a large city with shops, banks and new businesses","New railway lines joined the Rand to the ports on the southern coast","The Transvaal government collected far more money each year after 1886"],"correct":0,"feedback":"The city, the railways and the government income all grew. That is true, but all of it is growth. A claim about everyone is tested by the group that gained least. Black workers did the hardest jobs, and the law blocked better ones."},{"id":"q14","section":"s1","item_ref":"1.14","tier":"Apply","caps_level":3,"marks":2,"prompt":"A learner writes that black South Africans were only victims of the Mineral Revolution. Which fact shows that this is too simple?","options":["Some African farmers sold food in the towns and out-produced Boer farmers","Black workers were housed in closed compounds, far away from their families","Mining companies held black wages down so that their profits stayed high","The law gave the safer and better paid mine jobs to white workers only"],"correct":0,"feedback":"Compounds, low wages and job laws all show what was done to people. Farmers selling food in the towns were acting for themselves. Black South Africans used new chances, but their choices stayed limited. Both halves of the picture matter."},{"id":"q15","section":"s1","item_ref":"1.15","tier":"Apply","caps_level":3,"marks":2,"prompt":"A learner wrote this answer to the question: how did the Mineral Revolution change South Africa? What is its main weakness?","options":["It lists changes but never explains why any of them happened","It uses facts that are wrong and dates that do not match","It is far too short to earn any marks at all","It writes about gold when the question asked about diamonds"],"correct":0,"feedback":"Every fact in it is correct. The problem is that nothing is joined up. Marks come from explaining why the changes followed the gold, not from naming them.","stimulus":"The Mineral Revolution changed South Africa. Gold was found in 1886. Johannesburg grew very big. Railways were built. Many workers came to the mines. The Randlords became rich."},{"id":"q16","section":"s2","item_ref":"2.1","tier":"Recall","caps_level":1,"marks":2,"prompt":"Who were the Uitlanders (outsiders) in the Transvaal in the 1890s?","options":["Mostly British people who came to work on the mines","Boer farmers who moved north to look for better farmland","Black migrant workers brought in from across southern Africa","Officials that Britain sent out to rule over the Transvaal"],"correct":0,"feedback":"Uitlander means outsider. Most of them were British people who came for the gold. They lived and worked in the Transvaal. The government there did not treat them as its own."},{"id":"q17","section":"s2","item_ref":"2.2","tier":"Recall","caps_level":1,"marks":2,"prompt":"Most Uitlanders in the Transvaal were denied one important political right. Which one?","options":["The right to vote in Transvaal elections","The right to own a business in the town","The right to send their children to school","The right to travel between the two republics"],"correct":0,"feedback":"Uitlanders could work and own businesses, but most of them could not vote. Only men over forty who had lived in the Transvaal for fourteen years were allowed to vote."},{"id":"q18","section":"s2","item_ref":"2.3","tier":"Recall","caps_level":1,"marks":2,"prompt":"In 1895 to 1896, two British colonists tried to organise an uprising against the Transvaal government. Who were they?","options":["Cecil Rhodes and Leander Jameson","Alfred Beit and Barney Barnato","Paul Kruger and Jan Smuts","Alfred Milner and Joseph Chamberlain"],"correct":0,"feedback":"Cecil Rhodes and Leander Starr Jameson organised the raid that failed. It began in December 1895 and collapsed in January 1896. That is why you will see both years written down. Beit and Barnato were Randlords, but they did not lead it."},{"id":"q19","section":"s2","item_ref":"2.4","tier":"Recall","caps_level":1,"marks":2,"prompt":"In 1895 the Transvaal finished a new railway line to the sea. Why did that line matter?","options":["It gave the Transvaal a port that Britain did not control","It carried gold straight to the mines in the Cape Colony","It let the Transvaal move its army quickly to the border","It was the first railway line built in all of southern Africa"],"correct":0,"feedback":"The line ran from the Rand to Maputo, in Portuguese East Africa. Transvaal goods no longer had to pass through British ports. Britain lost some of its hold over Transvaal trade."},{"id":"q20","section":"s2","item_ref":"2.5","tier":"Recall","caps_level":1,"marks":2,"prompt":"Kruger's government built closer relations with two European countries. Which two?","options":["Holland and Germany","Britain and France","Portugal and Belgium","Italy and Russia"],"correct":0,"feedback":"The Transvaal grew closer to Holland and to Germany. Germany was the main industrial rival of Britain. That friendship worried British officials a great deal."},{"id":"q21","section":"s2","item_ref":"2.6","tier":"Recall","caps_level":1,"marks":2,"prompt":"On 9 October 1899 Kruger sent Britain an ultimatum (a final demand). What did it demand?","options":["That British troops leave the borders within forty eight hours","That Britain give the Uitlanders full voting rights straight away","That Britain pay for the damage done by the raid that failed","That Britain hand the whole Cape Colony over to the Transvaal"],"correct":0,"feedback":"Kruger demanded that British troops withdraw from the borders within forty eight hours. Britain did not do it, so the Boers declared war on 11 October 1899."},{"id":"q22","section":"s2","item_ref":"2.7","tier":"Understand","caps_level":2,"marks":2,"prompt":"Most Randlords supported a British takeover of the Transvaal. Why did they want this?","options":["They believed a British government would cut their costs and lift profits","They wanted to close the mines and move all their money back to Britain","They were ordered to support it by the Transvaal government of the day","They wanted black workers to be paid the same wages as white workers"],"correct":0,"feedback":"The Randlords complained that Transvaal policy raised their mining costs and that their taxes went to farming. They wanted a government that served their business needs, so British control looked better for profit."},{"id":"q23","section":"s2","item_ref":"2.8","tier":"Understand","caps_level":2,"marks":2,"prompt":"Why did the wealth of the Transvaal worry British officials in the 1890s?","options":["The richest part of southern Africa sat outside British control","The Transvaal had a bigger army than Britain had in the world","The Transvaal refused to sell any of its gold to Britain at all","Gold from the Transvaal had made British money worth much less"],"correct":0,"feedback":"Gold made the Transvaal the economic centre of southern Africa. Britain wanted the whole region joined under its own control. A rich republic outside that control was a threat."},{"id":"q24","section":"s2","item_ref":"2.9","tier":"Understand","caps_level":2,"marks":2,"prompt":"Kruger would not give the Uitlanders full voting rights. Which reason best explains this?","options":["Uitlanders outnumbered the Boers, so their votes could take over the republic","Uitlanders paid no taxes at all, so the government owed them nothing in return","Uitlanders were not allowed by British law to vote in any country but Britain","Uitlanders had already been offered farming land instead of getting the vote"],"correct":0,"feedback":"Uitlanders outnumbered the Boers inside the Transvaal. Full voting rights would have handed the republic to people loyal to Britain. So Kruger kept the voting rules tight."},{"id":"q25","section":"s2","item_ref":"2.10","tier":"Understand","caps_level":2,"marks":2,"prompt":"How does the discovery of gold link the Mineral Revolution to the war of 1899?","options":["Gold made the Transvaal rich and strong, and Britain wanted that control","Gold ran out by 1899, so Britain attacked to take the very last of it","Gold made the Boer farmers poor, so they attacked British farms for money","Gold was found in the Cape, so the Boers invaded to take those new mines"],"correct":0,"feedback":"Gold changed who held the power. It drew in the Uitlanders and made the Randlords strong. It made the Transvaal the richest state in the region. Britain went to war over that wealth."},{"id":"q26","section":"s2","item_ref":"2.11","tier":"Understand","caps_level":2,"marks":2,"prompt":"The raid led by Rhodes and Jameson failed. Why did it still make war more likely?","options":["It showed that Britain would help bring the Transvaal government down","It killed so many Boers that the republic wanted revenge at once","It gave Britain control of the goldfields for the first time","It forced Kruger to give the Uitlanders the vote straight away"],"correct":0,"feedback":"The raid failed on the ground, but it destroyed trust. Kruger now had proof that British leaders would use force. Both sides began preparing for a war after it."},{"id":"q27","section":"s2","item_ref":"2.12","tier":"Understand","caps_level":2,"marks":2,"prompt":"Most Uitlanders were British. Why did their treatment become a matter for Britain?","options":["Britain could say it was protecting its own people in another state","Britain paid the wages of every Uitlander working on the mines","British law applied inside the Transvaal because of an older treaty","The Uitlanders had all kept the right to vote in British elections"],"correct":0,"feedback":"Their treatment gave Britain a public reason to press Kruger. Protecting British people sounded better than demanding goldfields. The demand was real, and it was also useful."},{"id":"q28","section":"s2","item_ref":"2.13","tier":"Apply","caps_level":3,"marks":2,"prompt":"Kruger sent his ultimatum on 9 October 1899, and the war began two days later. What kind of cause is the ultimatum?","options":["The trigger, because it set the fighting off almost at once","A long term cause, because it built up over many long years","A short term cause, because it worked over several months","Not a cause at all, because Britain ignored what it demanded"],"correct":0,"feedback":"A trigger is the last event before the fighting starts. The ultimatum ran out after forty eight hours. The war followed at once, so it is the trigger and not a slow cause."},{"id":"q29","section":"s2","item_ref":"2.14","tier":"Apply","caps_level":3,"marks":2,"prompt":"Two learners disagree. One says the war was about voting rights. The other says it was about gold. Which answer is strongest?","options":["Both mattered, but voting rights were the argument used to reach gold","Only voting rights mattered, because that is what the British government demanded","Only gold mattered, because the Uitlanders never really cared about the vote","Neither mattered, because the war was started by the ultimatum alone"],"correct":0,"feedback":"Britain demanded voting rights in public. Behind that demand lay control of the goldfields and of southern Africa. Weighing causes means saying which one carried the most weight, not just listing them."},{"id":"q30","section":"s2","item_ref":"2.15","tier":"Apply","caps_level":3,"marks":2,"prompt":"A learner wrote this answer to the question: why did war break out in 1899? What is its main weakness?","options":["It stops at the last event and ignores what built up","It gets the date of the declaration of war badly wrong","It blames Britain when the Transvaal had declared the war","It uses no facts at all, only the learner's own opinion"],"correct":0,"feedback":"The account is correct as far as it goes. It explains how the war started, not why. Gold, the Uitlanders and the pressure from the Randlords are all missing.","stimulus":"War broke out in 1899 because Kruger sent an ultimatum to Britain. He told the British troops to leave within forty eight hours. They did not leave. So the Boers declared war on 11 October 1899."}],"mta":{"intro":"Below are two answers to the same question, written by learners. Read each one, then judge it against six checks.","question":"Why did war break out between Britain and the Boer republics in 1899?","criteria":["Does it have a clear first sentence that answers the question?","Does it use real facts, names or dates?","Does it give more than one reason?","Does it explain why, and not only what?","Does it end with a sentence that pulls the reasons together?","Is it one joined up answer, and not a list of loose sentences?"],"answers":[{"label":"Answer A","text":"War broke out in 1899 for a few reasons. The Uitlanders came to the Transvaal to work on the gold mines. Kruger would not let them vote. Britain was angry about this. Rhodes and Jameson also tried to start an uprising and it failed. Kruger then sent an ultimatum to Britain. The Boers declared war in October 1899.","expected_marks":"?-5","verdicts":[{"correct":"partial","explain":"The first sentence says there were reasons, but it does not say what the main one was. A clear first sentence names the reason before the detail follows."},{"correct":"yes","explain":"It names Kruger, Rhodes, Jameson and the Uitlanders, and it gives October 1899. The facts here are correct and specific."},{"correct":"yes","explain":"It gives the vote, the failed raid and the ultimatum. That is more than one reason, which is what the question asks for."},{"correct":"no","explain":"It tells you what happened in order, but never why any of it led to war. Britain being angry is stated, not explained."},{"correct":"no","explain":"It stops at the declaration of war. There is no closing sentence that says which reason mattered most."},{"correct":"partial","explain":"The events are in the right order, but most sentences stand alone. Words such as because and therefore would join them into one argument."}]},{"label":"Answer B","text":"War broke out in 1899 mainly because Britain wanted control of the Transvaal goldfields. After 1886 the Transvaal became the richest state in southern Africa, which threatened British power in the region. The Randlords wanted a government that would lower their mining costs, so they backed a British takeover. Britain used the voting rights of the Uitlanders as a public reason to put pressure on Kruger. Kruger refused, because Uitlander votes would have handed his republic to Britain. His ultimatum in October 1899 then started the fighting. Gold was therefore the deeper cause, and the vote was the argument built on top of it.","expected_marks":"?-8","verdicts":[{"correct":"yes","explain":"The first sentence names one main reason and takes a position. Everything after it works to support that position."},{"correct":"yes","explain":"It uses 1886, the Randlords, the Uitlanders, Kruger and the October ultimatum. The facts are correct and they are used, not just listed."},{"correct":"yes","explain":"It gives the goldfields, the pressure from the Randlords, the voting rights and the ultimatum. Several reasons are covered."},{"correct":"yes","explain":"Almost every sentence carries a reason. It says why the wealth threatened Britain and why Kruger refused the vote."},{"correct":"yes","explain":"The last sentence says which cause was deeper and how the other one sat on top of it. That is what pulling the reasons together looks like."},{"correct":"yes","explain":"The sentences are joined by because, so and therefore. The answer reads as one argument rather than a list."}]}],"heading":"Mark someone else's answer","lead":"Two learners answered the same question. You decide how good each answer is."},"glossary":{"Mineral Revolution":"The big change in South Africa after diamonds and gold were found. Farming areas turned into mines and towns.","Witwatersrand":"The ridge of hills near Johannesburg where gold was found in 1886. Most people call it the Rand.","Rand":"Short for the Witwatersrand, the gold bearing ridge where Johannesburg grew.","Randlord":"A very rich man who owned large gold mining companies on the Rand.","Randlords":"Very rich men who owned the large gold mining companies on the Rand.","migrant worker":"A worker who leaves home to work far away, then goes back. The family stays behind.","migrant":"Someone who leaves home to work far away and later returns.","compound":"A closed, fenced place at a mine where black workers had to live. They could not come and go freely.","compounds":"Closed, fenced places at the mines where black workers had to live under strict control.","profit":"The money a business has left over once all its costs are paid.","profits":"The money a business has left over once all its costs are paid.","wages":"The money a worker is paid for the work they do.","capital":"A large amount of money put into a business so that it can grow.","taxes":"Money that people are forced to pay to a government.","Boer":"A Dutch speaking farmer in South Africa. The word itself means farmer.","Boers":"Dutch speaking farmers in South Africa. The word itself means farmer.","republic":"A state that rules itself and has no king or queen over it.","Transvaal":"A Boer republic in the north. Johannesburg and the gold mines lay inside it.","colony":"A place that is ruled by another country. The Cape was a British colony.","Uitlander":"An outsider. In the Transvaal it meant a foreigner, most often British, who came for the gold.","Uitlanders":"Outsiders. In the Transvaal they were foreigners, most often British, who came for the gold.","ultimatum":"A final demand. Do this by a set time, or something serious follows.","Chamber of Mines":"A group the mine owners started so that they could act as one.","rinderpest":"A cattle disease that killed huge numbers of cattle in 1896 and 1897.","amaWasha":"Zulu men in Johannesburg who earned a living by washing other people's clothes.","long term cause":"A reason that builds up slowly, over many years, before something happens.","short term cause":"A reason that works over months, much closer to the event itself.","trigger":"The last event before the fighting starts. It sets off what was already building.","industrial":"Built on factories, machines and mines rather than on farming.","deep-level mining":"Mining gold far underground. It needs shafts, machines and a great deal of money.","goldfields":"The areas where gold was mined on the Rand."},"name_screen":{"title":"Your name","intro":"So your teacher can see your work.","first_label":"First name","surname_label":"Surname","wait":"Both are needed."},"confidence":{"scale":["Not sure at all","A little sure","Half sure","Quite sure","Very sure"],"before":{"title":"How sure are you right now?","prompt":"Before you start, say how sure you feel about this work.","topic":"Why gold changed South Africa, and why war broke out in 1899.","reason_prompt":"In one line, why did you choose that? You may leave this empty."},"after":{"title":"And now?","prompt":"You have finished the questions. Say how sure you feel now.","topic":"Why gold changed South Africa, and why war broke out in 1899.","reason_prompt":"What changed, or what is still unclear? You may leave this empty."}},"hook":{"eyebrow":"Before any history","title":"Water under the ground","scenario":["Picture a piece of open ground near where people live. For years nobody wants it.","Then someone finds water under it. Clean water, and a great deal of it.","Getting it out means digging deep. Digging deep needs machines, and machines cost money."],"questions":[{"prompt":"Who do you think ends up with most of the money from that water?","options":[{"text":"The people who already own the machines","note":"That is usually how it goes. Digging deep costs a lot, so those who can pay take the largest share."},{"text":"The people who do the digging","note":"It feels fair. In practice the diggers are paid a wage, while someone else keeps what is left over."},{"text":"Everyone nearby, with the money shared out","note":"That would be good. Sharing like that almost never happens on its own."}]},{"prompt":"Hundreds of people arrive looking for that digging work. What happens to the pay?","options":[{"text":"The pay goes down","note":"Yes, that is the usual result. When many people need one job, the people paying can offer less."},{"text":"The pay goes up","note":"It can, when workers are hard to find. Here there are hundreds, so the pressure runs the other way."},{"text":"The pay stays the same","note":"Sometimes it does. But when workers far outnumber the jobs, pay is usually pushed down."}]},{"prompt":"The newcomers soon outnumber the people who lived there. They want a say in the rules. Would you give it?","options":[{"text":"Yes, they live here now too","note":"That is a fair argument. It is also exactly the argument the newcomers would make."},{"text":"No, they would soon take over","note":"Also fair. If they outnumber you, your own vote stops deciding anything."},{"text":"A small say, not a full one","note":"That is what many governments try. It rarely keeps anyone happy for long."}]}],"turn":{"title":"Now change three words","paras":["Water becomes gold. The open ground becomes the Witwatersrand. The newcomers become Uitlanders.","Everything else stays the same. Who pays, who gains, and who is allowed a vote.","You have just thought your way through this whole unit. The questions ahead only add the names and the dates."]}},"vocab":{"title":"Words you will meet","intro":"Tap a word to see what it means. You can come back to these at any time using the Words button.","terms":["Mineral Revolution","Randlord","migrant worker","compound","republic","Uitlander","ultimatum","trigger"],"note":"You will need these words to understand the content."},"bands":["Room to grow","Coming along","Solid","Strong"],"results_heading":"Your skills"};

<script>
/* Kula Revise, Grade 10 content quiz engine.
   Offline first. Every answer is written to this device before anything else. */

(function () {
  'use strict';

  var DATA = window.QUIZ_DATA;
  var STORE_KEY = 'kula.g10.' + DATA.meta.id;
  var QUEUE_KEY = STORE_KEY + '.queue';
  var SYNC_URL = window.KULA_SYNC_URL || null;
  var SEND_NAMES = window.KULA_SEND_NAMES !== false;

  var screen = document.getElementById('screen');
  var bar = document.getElementById('bar');
  var barStep = document.getElementById('bar-step');
  var barFill = document.getElementById('bar-fill');
  var barXp = document.getElementById('bar-xp');
  var barWords = document.getElementById('bar-words');
  var offlineFlag = document.getElementById('offline-flag');
  var sheet = document.getElementById('sheet');
  var sheetBody = document.getElementById('sheet-body');
  var sheetClose = document.getElementById('sheet-close');

  var TIER_ORDER = ['Recall', 'Understand', 'Apply'];
  var BAND_MIN_ITEMS = 4;

  /* ---------- storage ---------- */

  function readStore() {
    try { var raw = localStorage.getItem(STORE_KEY); return raw ? JSON.parse(raw) : {}; }
    catch (e) { return {}; }
  }
  function writeStore(obj) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); } catch (e) {}
  }
  function readQueue() {
    try { var raw = localStorage.getItem(QUEUE_KEY); return raw ? JSON.parse(raw) : []; }
    catch (e) { return []; }
  }
  function writeQueue(rows) {
    try { localStorage.setItem(QUEUE_KEY, JSON.stringify(rows)); } catch (e) {}
  }
  function queueRow(row) {
    var s = readStore();
    row.learner_ref = s.learnerRef || null;
    if (SEND_NAMES && s.firstName) {
      row.learner_first_name = s.firstName;
      row.learner_surname = s.surname || null;
    }
    var q = readQueue();
    q.push(row);
    writeQueue(q);
    trySync();
  }
  function trySync() {
    if (!SYNC_URL || !navigator.onLine) return;
    var q = readQueue();
    if (!q.length) return;
    fetch(SYNC_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows: q })
    }).then(function (res) {
      if (!res.ok) throw new Error('rejected');
      return res.json().catch(function () { return {}; });
    }).then(function (body) {
      writeQueue([]);
      if (body && typeof body.cohort_median_marks === 'number') {
        var s = readStore();
        s.cohortMedian = body.cohort_median_marks;
        writeStore(s);
      }
    }).catch(function () {});
  }
  function flagOffline() {
    offlineFlag.className = navigator.onLine ? 'offline-flag' : 'offline-flag on';
  }
  window.addEventListener('online', function () { flagOffline(); trySync(); });
  window.addEventListener('offline', flagOffline);

  /* ---------- who ---------- */

  function first() { return readStore().firstName || ''; }
  function withName(text, fallback) {
    var f = first();
    if (f) return text.replace(/\{name\}/g, f);
    return fallback;
  }
  function lower(s) { return s.charAt(0).toLowerCase() + s.slice(1); }

  /* ---------- state ---------- */

  var state = null;
  var hookIndex = 0;

  function newAttempt() {
    var store = readStore();
    store.attempts = (store.attempts || 0) + 1;
    if (!store.learnerRef) store.learnerRef = 'L' + Math.random().toString(36).slice(2, 10);
    writeStore(store);
    state = {
      attemptId: DATA.meta.id + '.' + Date.now(),
      attemptNo: store.attempts,
      index: 0,
      shuffles: {},
      responses: {},
      streak: 0,
      bestStreak: 0,
      guidesOpened: {},
      wordsOpened: {},
      confidenceBefore: null,
      startedAt: new Date().toISOString()
    };
  }

  function shuffleFor(item) {
    if (state.shuffles[item.id]) return state.shuffles[item.id];
    var idx = item.options.map(function (_, i) { return i; });
    for (var i = idx.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = idx[i]; idx[i] = idx[j]; idx[j] = t;
    }
    state.shuffles[item.id] = idx;
    return idx;
  }
  function marksAwarded() {
    var n = 0;
    for (var k in state.responses) {
      if (Object.prototype.hasOwnProperty.call(state.responses, k)) n += state.responses[k].marks_awarded;
    }
    return n;
  }
  function tierTotals(responses) {
    var out = {};
    TIER_ORDER.forEach(function (t) { out[t] = { awarded: 0, available: 0, items: 0 }; });
    for (var k in responses) {
      if (!Object.prototype.hasOwnProperty.call(responses, k)) continue;
      var r = responses[k];
      out[r.tier].awarded += r.marks_awarded;
      out[r.tier].available += r.marks_available;
      out[r.tier].items += 1;
    }
    return out;
  }
  function bandFor(a, b) {
    var pct = b ? (a / b) * 100 : 0;
    if (pct >= 80) return DATA.bands[3];
    if (pct >= 60) return DATA.bands[2];
    if (pct >= 40) return DATA.bands[1];
    return DATA.bands[0];
  }

  /* ---------- builders ---------- */

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = text;
    return n;
  }
  function clear() {
    while (screen.firstChild) screen.removeChild(screen.firstChild);
    if (window.scrollTo) window.scrollTo(0, 0);
  }

  /* ---------- word meanings ---------- */

  var TERMS = Object.keys(DATA.glossary).sort(function (a, b) { return b.length - a.length; });

  function openWord(term) {
    var def = DATA.glossary[term];
    if (!def) return;
    if (state) state.wordsOpened[term] = true;
    while (sheetBody.firstChild) sheetBody.removeChild(sheetBody.firstChild);
    sheetBody.appendChild(el('h3', null, term));
    sheetBody.appendChild(el('p', null, def));
    sheet.className = 'sheet open';

  function closeSheet() { sheet.className = 'sheet'; }

  /* Writes text into a node and turns the first mention of each known word
     into something the learner can tap for a plain meaning. */
  function say(node, text) {
    var used = {};
    var remaining = String(text);
    var guard = 0;
    while (remaining.length && guard < 500) {
      guard++;
      var bestAt = -1, bestTerm = null;
      for (var i = 0; i < TERMS.length; i++) {
        var term = TERMS[i];
        if (used[term.toLowerCase()]) continue;
        var re = new RegExp('(^|[^A-Za-z])(' + term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')(?![A-Za-z])', 'i');
        var m = re.exec(remaining);
        if (!m) continue;
        var at = m.index + m[1].length;
        if (bestAt === -1 || at < bestAt) { bestAt = at; bestTerm = term; }
      }
      if (bestTerm === null) { node.appendChild(document.createTextNode(remaining)); break; }
      var shown = remaining.substr(bestAt, bestTerm.length);
      used[bestTerm.toLowerCase()] = true;
      if (bestAt > 0) node.appendChild(document.createTextNode(remaining.slice(0, bestAt)));
      node.appendChild(wordButton(shown, bestTerm));
      remaining = remaining.slice(bestAt + bestTerm.length);
    }
    return node;
  }
  function wordButton(shown, term, extra) {
    var b = el('button', 'word' + (extra ? ' ' + extra : ''), shown);
    b.setAttribute('aria-label', 'What does ' + shown + ' mean?');
    b.addEventListener('click', function () { openWord(term); });
    return b;
  }
  function para(text, cls) { return say(el('p', cls || null), text); }

  function renderItem() {
    var item = DATA.items[state.index];
    if (!item) return renderConfidence('after');

    clear();
    updateBar(state.index + 1, DATA.items.length);

    var tier = DATA.tiers[item.tier];
    var c = el('div', 'card');

    var meta = el('div', 'qmeta');
    meta.appendChild(el('span', 'qnum', 'Question ' + (state.index + 1)));
    meta.appendChild(el('span', 'qmarks', item.marks + (item.marks === 1 ? ' mark' : ' marks')));
    c.appendChild(meta);

    if (item.stimulus) {
      var box = el('div', 'stimulus');
      box.appendChild(el('div', 'stimulus-tag', 'Read this answer'));
      box.appendChild(say(el('p'), item.stimulus));
      c.appendChild(box);
    }
    c.appendChild(say(el('p', 'qtext'), item.prompt));

    var guideBtn = el('button', 'guide-btn', 'Help with this question');
    var guideBox = el('div', 'guide-box hide');
    guideBox.appendChild(el('h3', null, tier.guide_title));
    var ul = document.createElement('ul');
    tier.guide.forEach(function (line) { ul.appendChild(el('li', null, line)); });
    guideBox.appendChild(ul);
    guideBtn.addEventListener('click', function () {
      var open = guideBox.className.indexOf('hide') === -1;
      guideBox.className = open ? 'guide-box hide' : 'guide-box';
      guideBtn.textContent = open ? 'Help with this question' : 'Close';
      state.guidesOpened[item.id] = true;
    });
    c.appendChild(guideBtn);
    c.appendChild(guideBox);

    var order = shuffleFor(item);
    var list = el('div', 'opts');
    var buttons = [];
    order.forEach(function (origIndex) {
      var b = el('button', 'opt');
      var m = el('span', 'mark', '');
      b.appendChild(m);
      b.appendChild(el('span', null, item.options[origIndex]));
      b.addEventListener('click', function () { answer(origIndex); });
      buttons.push({ node: b, mark: m, orig: origIndex });
      list.appendChild(b);
    });
    c.appendChild(list);
    screen.appendChild(c);

    function answer(chosen) {
      var isRight = chosen === item.correct;
      var awarded = isRight ? item.marks : 0;

      state.responses[item.id] = {
        item_id: item.id, item_ref: item.item_ref, tier: item.tier,
        caps_level: item.caps_level, marks_awarded: awarded,
        marks_available: item.marks, correct: isRight
      };
      queueRow({
        quiz_id: DATA.meta.id,
        attempt_id: state.attemptId,
        attempt_no: state.attemptNo,
        row_type: 'response',
        item_id: item.id,
        item_ref: item.item_ref,
        tier: item.tier,
        caps_level: item.caps_level,
        marks_awarded: awarded,
        marks_available: item.marks,
        chosen_option: chosen,
        guide_opened: !!state.guidesOpened[item.id],
        answered_at: new Date().toISOString(),
        offline_when_answered: !navigator.onLine
      });

      if (isRight) {
        state.streak += 1;
        if (state.streak > state.bestStreak) state.bestStreak = state.streak;
      } else {
        state.streak = 0;
      }

      buttons.forEach(function (b) {
        b.node.disabled = true;
        if (b.orig === item.correct) { b.node.className = 'opt right'; b.mark.textContent = '\u2713'; }
        else if (b.orig === chosen) { b.node.className = 'opt wrong'; b.mark.textContent = '\u2715'; }
      });

      var v = el('div', 'verdict ' + (isRight ? 'right' : 'wrong'));
      var hd = el('div', 'verdict-hd');
      hd.appendChild(el('span', null, isRight ? '\u2713' : '\u2715'));
      var head = isRight ? 'Right' : 'Not right';
      if (isRight && first() && state.index % 4 === 0) head = 'Right, ' + first();
      hd.appendChild(el('span', null, head));
      v.appendChild(hd);
      v.appendChild(say(el('p'), item.feedback));
      c.appendChild(v);

      if (isRight && state.streak >= 3) {
        c.appendChild(el('div', 'streak', state.streak + ' right in a row.'));
      }

      var next = DATA.items[state.index + 1];
      var btn = el('button', 'btn', next ? 'Next question' : 'Nearly done');
      btn.addEventListener('click', function () {
        state.index += 1;
        if (!next) return renderConfidence('after');
        if (next.section !== item.section) {
          var sec = DATA.sections.filter(function (s) { return s.id === next.section; })[0];
          return renderSection(sec);
        }
        renderItem();
      });
      c.appendChild(btn);
      if (v.scrollIntoView) v.scrollIntoView({ block: 'nearest' });
    }
  }

  function renderResults() {
    clear();
    bar.className = 'bar hide';

    var awarded = marksAwarded();
    var available = DATA.meta.total_marks;
    var pct = (awarded / available) * 100;

    var store = readStore();
    if (!store.first) store.first = awarded;
    if (!store.best || awarded > store.best) store.best = awarded;
    writeStore(store);
    trySync();

    var c = el('div', 'card');
    c.appendChild(el('div', 'eyebrow', 'Attempt ' + state.attemptNo));
    c.appendChild(el('h2', null, withName('{name}, you scored ' + awarded + ' out of ' + available,
      'You scored ' + awarded + ' out of ' + available)));

    var track = el('div', 'goldbar');
    var fill = el('div', 'goldbar-fill');
    track.appendChild(fill);
    c.appendChild(track);
    setTimeout(function () { fill.style.width = pct + '%'; }, 80);

    if (store.best > awarded) {
      c.appendChild(el('p', 'lead', 'Your best is still ' + store.best + '. Both are kept.'));
    } else if (state.attemptNo > 1) {
      c.appendChild(el('p', 'lead', 'That is your best so far. Your first try was ' + store.first + '.'));
    }
    if (typeof store.cohortMedian === 'number') {
      c.appendChild(el('p', 'lead', 'The middle score in your group is ' + store.cohortMedian + '. No names are shown, not yours and not anyone else\u2019s.'));
    }
    if (state.bestStreak >= 3) {
      c.appendChild(el('div', 'streak', 'Longest run of correct answers: ' + state.bestStreak + '.'));
    }
    screen.appendChild(c);

    var b = el('div', 'card');
    b.appendChild(el('h3', null, DATA.results_heading));
    var totals = tierTotals(state.responses);
    TIER_ORDER.forEach(function (t) {
      var block = el('div', 'band-block');
      var row = el('div', 'band-row');
      var nameBox = el('div', 'band-name');
      nameBox.appendChild(el('strong', null, t));
      nameBox.appendChild(el('span', null, DATA.tiers[t].meaning));
      row.appendChild(nameBox);
      var enough = totals[t].items >= BAND_MIN_ITEMS;
      var band = enough ? bandFor(totals[t].awarded, totals[t].available) : null;
      row.appendChild(enough ? el('div', 'band-val', band)
        : el('div', 'locked', 'Answer ' + (BAND_MIN_ITEMS - totals[t].items) + ' more'));
      block.appendChild(row);
      b.appendChild(block);

    screen.appendChild(b);

    var m = el('div', 'card');

  function renderMta(which) {
    clear();
    bar.className = 'bar hide';
    var mta = DATA.mta;
    var ans = mta.answers[which];

    var intro = el('div', 'card');
    intro.appendChild(el('div', 'eyebrow', 'Now you mark it'));
    intro.appendChild(el('h2', null, ans.label));

    intro.appendChild(el('p', 'lead', 'The question was: ' + mta.question));
    intro.appendChild(say(el('div', 'answer-box'), ans.text));
    screen.appendChild(intro);

    var work = el('div', 'card');
    work.appendChild(el('h3', null, 'Mark it against these six checks'));
    var done = 0;

    mta.criteria.forEach(function (question, i) {
      var v = ans.verdicts[i];
      var box = el('div', 'crit');
      box.appendChild(el('div', 'crit-q', (i + 1) + '. ' + question));
      var btns = el('div', 'crit-btns');
      var made = [];
      [['yes', 'Yes'], ['partial', 'Partly'], ['no', 'No']].forEach(function (ch) {
        var b = el('button', 'btn', ch[1]);
        b.addEventListener('click', function () {
          if (box.getAttribute('data-answered')) return;
          box.setAttribute('data-answered', '1');
          for (var k = 0; k < made.length; k++) made[k].disabled = true;
          b.className = 'btn ' + (ch[0] === v.correct ? 'picked-right' : 'picked-wrong');
          var line = el('div', 'crit-exp');
          line.appendChild(el('strong', null, (ch[0] === v.correct ? '\u2713 ' : '\u2715 ') +
            'Your teacher would say: ' + ({ yes: 'Yes', partial: 'Partly', no: 'No' })[v.correct] + '. '));
          line.appendChild(document.createTextNode(v.explain));
          box.appendChild(line);
          done += 1;
          if (done === mta.criteria.length) closeBtn.className = 'btn';
        });
        made.push(b);
        btns.appendChild(b);
      });
      box.appendChild(btns);
      work.appendChild(box);
    });

    var closeBtn = el('button', 'btn hide', which + 1 < mta.answers.length ? 'Next answer' : 'Finish');
    closeBtn.addEventListener('click', function () {
      if (which + 1 < mta.answers.length) return renderMta(which + 1);
      renderMtaEnd();
    });
    work.appendChild(closeBtn);
    screen.appendChild(work);
  }
